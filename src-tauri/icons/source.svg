    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#6c63ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
