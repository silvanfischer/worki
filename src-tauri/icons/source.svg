  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 300 L372 716 L512 430 L652 716 L788 300" stroke="url(#stroke)" stroke-width="132"/>
    <path d="M236 300 L372 716 L512 430 L652 716 L788 300" stroke="url(#sheen)" stroke-width="132"/>
