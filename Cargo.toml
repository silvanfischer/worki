[workspace]
resolver = "2"
members = ["crates/worki-core", "crates/worki-isolation", "crates/worki-pty", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
dirs = "6"
tracing = "0.1"
tempfile = "3"
portable-pty = "0.8"
